name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y ca-certificates curl tar gzip coreutils git python3 make g++
      - run: npm ci
      - run: npm run check
      # The end-to-end tests attach to a real moor holder, so the binary has to
      # exist before the suite runs, not at packaging time. libexec/moor is
      # gitignored, so without this step every real-binary test skips silently
      # and the daemon↔moor seam ships with no automated coverage at all.
      - name: Fetch the bundled moor for the integration suite
        # Gated on the committed pin: before the first pinned moor release
        # exists there is nothing to verify-download, and the native E2E
        # suite skips itself when libexec/moor is absent.
        if: ${{ hashFiles('scripts/distribution/moor-pin.json') != '' }}
        run: npm run fetch:moor
      - name: Test
        run: |
          test_tmp=$(mktemp -d /var/tmp/desk-vitest.XXXXXX)
          trap 'rm -rf "$test_tmp"' EXIT
          TMPDIR="$test_tmp" RUN_REAL_JOIN=1 npm test
      # Same pin gate as the fetch step: build:distribution re-invokes
      # fetch:moor (fail-closed without a pin), so before the first pinned
      # moor release CI proves the APPLICATION build only.
      - name: Build distribution (pinned moor + application)
        if: ${{ hashFiles('scripts/distribution/moor-pin.json') != '' }}
        run: npm run build:distribution
      - name: Build application (no pinned moor release yet)
        if: ${{ hashFiles('scripts/distribution/moor-pin.json') == '' }}
        run: npm run build:application
      - name: Probe bundled moor
        if: ${{ hashFiles('scripts/distribution/moor-pin.json') != '' }}
        run: test "$(./libexec/moor --version)" = 'moor 0.1.0'
      - run: npm run smoke:serve-modes
      - name: Restore and verify the Node CLI after runtime smoke
        run: npm run build
