name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - name: Prove and run internal path guard
        run: sh ci/tracked-paths.test.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure host dependencies
        shell: bash
        run: |
          if test -r /etc/ssl/certs/ca-certificates.crt \
            && command -v curl >/dev/null \
            && command -v tar >/dev/null \
            && command -v gzip >/dev/null \
            && command -v sha256sum >/dev/null \
            && command -v git >/dev/null \
            && command -v python3 >/dev/null \
            && command -v make >/dev/null \
            && command -v g++ >/dev/null \
            && command -v rg >/dev/null; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl tar gzip coreutils git python3 make g++ ripgrep
      - run: npm ci
      - run: npm run check
      - name: Build pinned Moor holder
        run: npm run build:moor
      - name: Test Moor distribution contract
        run: npx vitest run tests/moor-distribution-contract.test.ts
      - name: Test
        run: |
          test_tmp=$(mktemp -d /var/tmp/desk-vitest.XXXXXX)
          trap 'rm -rf "$test_tmp"' EXIT
          TMPDIR="$test_tmp" npx vitest run --exclude tests/moor-distribution-contract.test.ts --exclude tests/moor-native-e2e.test.ts
      - name: Build application
        run: npm run build:application
      - run: npm run smoke:serve-modes
      - name: Restore and verify the Node CLI after runtime smoke
        run: npm run build

  native-moor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Linux host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if test -r /etc/ssl/certs/ca-certificates.crt \
            && command -v git >/dev/null \
            && command -v python3 >/dev/null \
            && command -v make >/dev/null \
            && command -v g++ >/dev/null; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ca-certificates git python3 make g++
      - run: npm ci
      - name: Build pinned Moor holder
        run: npm run build:moor
      - name: Test native Desk/Moor integration
        env:
          RUN_REAL_JOIN: 1
        run: npx vitest run tests/moor-native-e2e.test.ts --reporter=verbose

  macos-desk-units:
    # Positive macOS verification for the Desk-side macOS fixes that the native
    # lane cannot cover: the provider-session-evidence trust boundary (descriptor
    # alias re-open by capability) and the moor-generation-stores archive
    # preflight (descriptor alias opened without O_DIRECTORY). These are pure
    # unit tests -- no Moor binary, no build -- so they run fast on both Mac
    # architectures and are independent of the native-moor -S lane.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - name: Verify runner architecture is macOS
        run: test "$(uname -s)" = "Darwin"
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Verify macOS-sensitive Desk units on real Darwin /dev/fd semantics
        run: npx vitest run tests/provider-session-evidence.test.ts tests/provider-evidence-descriptor-alias-probe.test.ts tests/moor-generation-stores.test.ts tests/moor-generation-stores-alias-flags.test.ts tests/terminalDaemon.test.ts tests/terminalDaemonMain.test.ts tests/restore-attach-retention.test.ts
