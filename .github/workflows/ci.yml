name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - name: Prove and run internal path guard
        run: sh ci/tracked-paths.test.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y ca-certificates curl tar gzip coreutils git python3 make g++
      - run: npm ci
      - run: npm run check
      - name: Build pinned Moor holder
        run: npm run build:moor
      - name: Test Moor distribution contract
        run: npx vitest run tests/moor-distribution-contract.test.ts
      - name: Test
        run: |
          test_tmp=$(mktemp -d /var/tmp/desk-vitest.XXXXXX)
          trap 'rm -rf "$test_tmp"' EXIT
          TMPDIR="$test_tmp" npx vitest run --exclude tests/moor-distribution-contract.test.ts --exclude tests/moor-native-e2e.test.ts
      - name: Build application
        run: npm run build:application
      - run: npm run smoke:serve-modes
      - name: Restore and verify the Node CLI after runtime smoke
        run: npm run build

  native-moor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ca-certificates git python3 make g++
      - run: npm ci
      - name: Build pinned Moor holder
        run: npm run build:moor
      - name: Test native Desk/Moor integration
        env:
          RUN_REAL_JOIN: 1
        run: npx vitest run tests/moor-native-e2e.test.ts --reporter=verbose
